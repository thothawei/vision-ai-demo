name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # 只用標準託管 runner（公開 repo 免費）；不用 larger／self-hosted runner，不用第三方付費服務
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 系統套件（zxing / OpenCV / tesseract 需要）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-chi-tra libgl1
      - name: 安裝相依
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff==0.17.0 pytest-cov==7.1.0
      - name: 用詞檢查
        run: python scripts/check_wording.py
      - name: ruff check
        run: ruff check
      - name: ruff format
        run: ruff format --check
      - name: 產生測試圖
        run: python tests/samples/make_samples.py
      - name: pytest（不含 live／e2e）
        env:
          SESSION_SECRET: ci-session-secret-0123456789abcdefghijklmnop
        run: pytest --cov=backend --cov-report=term-missing --cov-report=xml
      - name: 上傳 coverage 報告為 artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
