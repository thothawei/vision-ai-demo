[project]
name = "vision-inspection-platform"
version = "1.0.1"
description = "製造業視覺品檢平台：離線 AI 辨識、品檢紀錄與 ERP 串接"
requires-python = ">=3.11,<3.12"
license = { text = "AGPL-3.0-or-later" }
# 相依版本以 backend/requirements.txt 為準，這裡不重複鎖定
dynamic = []

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["venv", "data", "models", "runs", "docs/erp-integration-sample"]

[tool.ruff.lint]
select = ["E", "F", "I"]
# 過長的中文字串與註解不折行（程式碼寬度由 ruff format 負責）
ignore = ["E501"]
