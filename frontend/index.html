<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>製造業 AI 辨識 Demo</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #0071e3;
    --border: #e5e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --card-bg: #2c2c2e;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --border: #3a3a3c;
    }
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 64px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.subtitle { color: var(--muted); margin-top: 0; margin-bottom: 24px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; }
  .tab-btn {
    padding: 10px 16px;
    border: none;
    background: none;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .card h2 { margin-top: 0; font-size: 17px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  input[type="file"] { flex: 1; min-width: 200px; }
  select, button {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 14px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .preview { max-width: 200px; max-height: 200px; border-radius: 8px; margin-top: 8px; display: none; }
  .result { margin-top: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { width: 30%; color: var(--muted); font-weight: 500; }
  .status { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .status.error { color: #ff3b30; }
  .verdict-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    margin-left: 8px;
  }
  .verdict-OK { background: #34c75933; color: #248a3d; }
  .verdict-NG { background: #ff3b3033; color: #d70015; }
  .verdict-INFO { background: #0071e333; color: #0071e3; }
</style>
</head>
<body>

<h1>製造業 AI 辨識 Demo</h1>
<p class="subtitle">本機執行：台中製造業常見 AI 辨識功能作品集（Phase 1：M9 開放式辨識 ／ M4 文件結構化）</p>

<div class="tabs">
  <button class="tab-btn active" data-tab="general">① 現場照片辨識</button>
  <button class="tab-btn" data-tab="docs">② 製造文件結構化</button>
</div>

<div class="panel active" id="panel-general">
  <div class="card">
    <h2>現場照片開放式辨識（M9）</h2>
    <p style="color:var(--muted); font-size:13px;">上傳機台、工具、零件或標示的照片，AI 會判斷「這是什麼」，並標註可見文字與安全觀察</p>
    <div class="row">
      <input type="file" id="general-file" accept="image/*">
      <button id="general-btn">開始辨識</button>
    </div>
    <img class="preview" id="general-preview">
    <div class="status" id="general-status"></div>
    <div class="result" id="general-result"></div>
  </div>
</div>

<div class="panel" id="panel-docs">
  <div class="card">
    <h2>製造文件結構化（M4）</h2>
    <p style="color:var(--muted); font-size:13px;">上傳工單、出貨單、檢驗報告等文件或掃描圖檔，AI 會擷取內容並整理成 JSON 欄位</p>
    <div class="row">
      <input type="file" id="docs-file" accept="image/*">
      <select id="docs-mode">
        <option value="ocr">OCR + AI 結構化（預設）</option>
        <option value="end_to_end">端到端（AI 直接讀圖）</option>
      </select>
      <button id="docs-btn">開始擷取</button>
    </div>
    <img class="preview" id="docs-preview">
    <div class="status" id="docs-status"></div>
    <div class="result" id="docs-result"></div>
  </div>
</div>

<script>
document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
  });
});

function setupPreview(fileInput, previewImg) {
  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file) { previewImg.style.display = "none"; return; }
    previewImg.src = URL.createObjectURL(file);
    previewImg.style.display = "block";
  });
}

function renderResult(container, data) {
  container.innerHTML = "";
  const badge = document.createElement("span");
  badge.textContent = `${data.module} · ${data.verdict} · ${data.engine} · ${data.elapsed_ms}ms`;
  badge.className = "verdict-badge verdict-" + data.verdict;
  container.appendChild(badge);

  const table = document.createElement("table");
  table.style.marginTop = "10px";
  const item = data.items[0] || {};
  for (const [key, value] of Object.entries(item)) {
    const tr = document.createElement("tr");
    const th = document.createElement("th");
    th.textContent = key;
    const td = document.createElement("td");
    td.textContent = typeof value === "object" ? JSON.stringify(value, null, 2) : value;
    tr.appendChild(th);
    tr.appendChild(td);
    table.appendChild(tr);
  }
  container.appendChild(table);
}

async function callApi(url, formData, statusEl, resultEl, button) {
  statusEl.textContent = "辨識中…請稍候（本機模型第一次呼叫較慢）";
  statusEl.className = "status";
  resultEl.innerHTML = "";
  button.disabled = true;
  try {
    const res = await fetch(url, { method: "POST", body: formData });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.detail || "辨識失敗");
    }
    statusEl.textContent = "完成";
    renderResult(resultEl, data);
  } catch (err) {
    statusEl.textContent = "錯誤：" + err.message;
    statusEl.className = "status error";
  } finally {
    button.disabled = false;
  }
}

const generalFile = document.getElementById("general-file");
setupPreview(generalFile, document.getElementById("general-preview"));
document.getElementById("general-btn").addEventListener("click", () => {
  const file = generalFile.files[0];
  if (!file) { alert("請先選擇照片"); return; }
  const formData = new FormData();
  formData.append("file", file);
  callApi(
    "/api/general/describe",
    formData,
    document.getElementById("general-status"),
    document.getElementById("general-result"),
    document.getElementById("general-btn")
  );
});

const docsFile = document.getElementById("docs-file");
setupPreview(docsFile, document.getElementById("docs-preview"));
document.getElementById("docs-btn").addEventListener("click", () => {
  const file = docsFile.files[0];
  if (!file) { alert("請先選擇圖檔"); return; }
  const mode = document.getElementById("docs-mode").value;
  const formData = new FormData();
  formData.append("file", file);
  callApi(
    "/api/docs/extract?mode=" + mode,
    formData,
    document.getElementById("docs-status"),
    document.getElementById("docs-result"),
    document.getElementById("docs-btn")
  );
});
</script>

</body>
</html>
